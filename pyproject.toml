[project]
name = "galea-bench-tau"
version = "0.1.0"
description = "Galea investigator benchmark against tau-bench trajectories"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
